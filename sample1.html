<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to SR University</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #6a11cb, #2575fc, #ff4b91);
        }

        .welcome-box {
            text-align: center;
            background: white;
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            color: #6a11cb;
            font-size: 45px;
            margin-bottom: 10px;
        }

        h2 {
            color: #ff4b91;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(90deg, #6a11cb, #2575fc);
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.1);
        }
    </style>
</head>

<body>

    <div class="welcome-box">
        <h1>🎓 Welcome!</h1>

        <h2>SR University</h2>

        <p>
            Welcome to a place of Innovation, Learning and Success.
        </p>

        <button onclick="alert('Welcome to SR University! ')">
            Explore SRU
        </button>
    </div>

</body>
</html>
